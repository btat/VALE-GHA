name: Vale Linting

on:
  pull_request:
    paths:
      - 'docs/**/*.adoc'
      - 'docs/**/*.md'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs repository
        uses: actions/checkout@v4
        with:
          path: 'main-repo'

      - name: Checkout SUSE style guide
        uses: actions/checkout@v4
        with:
          repository: 'openSUSE/suse-vale-styleguide'
          path: 'suse-styles'

      - name: Configure Vale
        run: |
          cat <<EOF > .vale.ini
          StylesPath = suse-styles
          MinAlertLevel = warning

          [*.adoc]
          BasedOnStyles = common, asciidoc

          [*.md]
          BasedOnStyles = common
          EOF

      - name: Run Vale
        uses: errata-ai/vale-action@v2
        with:
          files: 'main-repo/docs'