name: Vale Linting

on:
  pull_request:
    paths:
      - 'docs/**/*.adoc'
      - 'docs/**/*.md'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout docs repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # important for Vale + reviewdog to find .git

      - name: Checkout SUSE style guide
        uses: actions/checkout@v4
        with:
          repository: 'openSUSE/suse-vale-styleguide'
          path: 'suse-styles'

      - name: Install asciidoctor
        run: |
          sudo apt-get update
          sudo apt-get install -y asciidoctor

      - name: Configure .vale.ini
        run: |
          cat <<EOF > .vale.ini
          StylesPath = suse-styles
          MinAlertLevel = warning

          [*.adoc]
          BasedOnStyles = common, asciidoc

          [*.md]
          BasedOnStyles = common
          EOF

      - name: Run Vale
        uses: errata-ai/vale-action@v2
        with:
          files: 'docs'       # relative to root checkout
          version: latest
          debug: false
          reporter: github-pr-annotations
          fail_on_error: false
          level: error
          filter_mode: added
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
