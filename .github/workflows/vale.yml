name: Vale Linting

on:
  pull_request:
    paths:
      - 'docs/**/*.adoc'
      - 'docs/**/*.md'
      - 'docs/**/*.txt' 

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Docs Repository (Main Repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout SUSE Style Guide
        uses: actions/checkout@v4
        with:
          repository: 'openSUSE/suse-vale-styleguide'
          path: 'suse-styles'

      - name: Install Dependencies (Vale, Reviewdog, and Asciidoctor)
        run: |
          # ... (installation commands are unchanged)

      - name: Prepare Style Environment and Configure .vale.ini
        run: |
          # CRITICAL FIX: The spelling rule needs the 'config' folder in the parent directory.
          # The simplest fix is to copy the config folder up one level relative to the styles.
          cp -r suse-styles/config .

          # Dynamically create the .vale.ini file in the root directory
          # StylesPath is set to the current directory (.), forcing Vale to look at the top level
          # where we have placed the 'config' folder, and it will check the style folders nearby.
          cat <<EOF > .vale.ini
          StylesPath = suse-styles
          MinAlertLevel = warning
                    
          [*.adoc]
          BasedOnStyles = common, asciidoc
                    
          [*.md]
          BasedOnStyles = common

          [*.txt]
          BasedOnStyles = common
          EOF

      - name: Run Vale and Report to GitHub PR
        run: |
          # Execute Vale and store output in a variable
          VALE_OUTPUT=$(/usr/local/bin/vale --output=JSON --no-exit docs)
          
          # ... (rest of the block is the same)