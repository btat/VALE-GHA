name: Vale Linting

on:
  pull_request:
    paths:
      - 'docs/**/*.adoc'
      - 'docs/**/*.md'
      - 'docs/**/*.txt' 

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Docs Repository (Main Repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout SUSE Style Guide
        uses: actions/checkout@v4
        with:
          repository: 'openSUSE/suse-vale-styleguide'
          path: 'suse-styles'

      - name: Install Dependencies (Vale, Reviewdog, and Asciidoctor)
        run: |
          # Update and install Asciidoctor (for ADOC parsing) and jq
          sudo apt-get update
          sudo apt-get install -y asciidoctor jq

          # Install Vale (latest Linux binary)
          VALE_VERSION="3.12.0" # Use a specific version for stability
          VALE_URL="https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          curl -L "${VALE_URL}" | sudo tar -xz -C /usr/local/bin/

          # Install Reviewdog (for PR annotations)
          REVIEW_VERSION="0.17.0"
          REVIEW_URL="https://github.com/reviewdog/reviewdog/releases/download/v${REVIEW_VERSION}/reviewdog_${REVIEW_VERSION}_Linux_x86_64.tar.gz"
          curl -L "${REVIEW_URL}" | sudo tar -xz -C /usr/local/bin/

      - name: Configure .vale.ini
        run: |
          # Dynamically create the .vale.ini file in the root directory
          cat <<EOF > .vale.ini
          StylesPath = /home/runner/work/VALE-GHA/VALE-GHA/suse-style
          MinAlertLevel = warning # Use warning to detect errors and warnings
          
          [*.adoc]
          BasedOnStyles = SUSE-Doc, AsciiDoc-Style # Use expected style names
          
          [*.md]
          BasedOnStyles = SUSE-Doc
          
          [*.txt]
          BasedOnStyles = SUSE-Doc
          EOF

      - name: Run Vale and Report to GitHub PR
        run: |
          # Ensure Vale can see the configuration and styles
          vale sync
          
          # Execute Vale and store output in a variable
          VALE_OUTPUT=$(/usr/local/bin/vale --output=JSON --no-exit docs)
          
          # CRITICAL FIX: Check if the 'Results' array is not empty before running jq and reviewdog.
          if echo "$VALE_OUTPUT" | jq -e '.Results | length > 0' > /dev/null; then
            echo "Vale found issues. Sending results to Reviewdog..."
            
            echo "$VALE_OUTPUT" \
            | jq -c '.Results[] | . | {message, location: {path: .Location.Path, range: {start: {line: .Location.Span.Start.Line, column: .Location.Span.Start.Column}, end: {line: .Location.Span.End.Line, column: .Location.Span.End.Column}}}, severity: .Level}' \
            | /usr/local/bin/reviewdog -f=rdjsonl \
              -name="Vale Linter" \
              -reporter=github-pr-review \
              -level=warning # Set level to WARNING to match MinAlertLevel
              -filter-mode=added \
              -fail-on-error=false
          else
            echo "Vale found no issues. Skipping reviewdog reporting."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}